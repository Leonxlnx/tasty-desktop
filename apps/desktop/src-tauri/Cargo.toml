[package]
name = "tasty-desktop"
version = "0.11.1"
description = "A native multi-provider coding agent control panel"
authors = ["Tasty contributors"]
edition = "2021"

[lib]
name = "tasty_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
